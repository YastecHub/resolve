name: resolve

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resolve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resolve}
      POSTGRES_DB: ${POSTGRES_DB:-resolve}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    env_file:
      - path: .env
        required: false
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    environment:
      PORT: 9000
      DATABASE_URL: postgres://${POSTGRES_USER:-resolve}:${POSTGRES_PASSWORD:-resolve}@postgres:5432/${POSTGRES_DB:-resolve}
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_STAFF_ID: ${ADMIN_STAFF_ID:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      AI_PROFILES: ${AI_PROFILES:-[]}
      AI_ACTIVE_PROFILE: ${AI_ACTIVE_PROFILE:-hosted}
      CASE_FILES_DIR: /data/case-files
    volumes:
      - case-files:/data/case-files
    ports:
      - '${BIND_HOST:-127.0.0.1}:${API_PORT:-9000}:9000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - '${BIND_HOST:-127.0.0.1}:${WEB_PORT:-5175}:80'
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
  case-files:
